name: Automatizare alte meciuri

permissions:
  contents: write

on:
  schedule:
    # O data la 7 zile, joia la 05:00 UTC (08:00 ora Romaniei) — acopera
    # urmatoarele 7 zile de meciuri. Pe durata Cupei Mondiale scriptul ia
    # automat doar meciurile de la CM, apoi revine la toate ligile.
    - cron: "0 5 * * 4"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Extrage meciuri
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/alte_meciuri.py

      - name: Analiza Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_analiza.py

      - name: Verificare rezultate si statistici
        run: python scripts/verificare_rezultate.py

      - name: Commit & Push JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add alte_meciuri.json istoric_pronosticuri.json statistici.json
          git add cache_forma_echipe.json || true
          git commit -m "Update alte meciuri + analiza Gemini $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push
