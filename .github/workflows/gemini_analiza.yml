name: Automatizare alte meciuri

permissions:
  contents: write

on:
  schedule:
    # Pe durata Cupei Mondiale 2026 (iunie-iulie) sunt meciuri zilnic,
    # deci rulam in fiecare zi. Scriptul intra automat in mod Cupa Mondiala
    # (doar meciurile de la CM) pana pe 19 iulie, apoi revine la toate ligile.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Extrage meciuri
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/alte_meciuri.py

      - name: Analiza Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_analiza.py

      - name: Commit & Push JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add alte_meciuri.json
          git commit -m "Update alte meciuri + analiza Gemini $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push
