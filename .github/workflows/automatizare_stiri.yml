name: Automatizare stiri

on:
  schedule:
    # 10:00 si 19:00 ora Romaniei. GitHub Actions cron ruleaza in UTC.
    # Iarna (EET, UTC+2): 10:00 RO = 08:00 UTC | 19:00 RO = 17:00 UTC
    # Vara (EEST, UTC+3): 10:00 RO = 07:00 UTC | 19:00 RO = 16:00 UTC
    # Cele 4 intrari acopera ambele perioade DST.
    # In zilele de tranzitie poate rula de doua ori - cache-ul si dedupe-ul absorb.
    - cron: '0 8 * * *'   # 10:00 EET (iarna)
    - cron: '0 7 * * *'   # 10:00 EEST (vara)
    - cron: '0 17 * * *'  # 19:00 EET (iarna)
    - cron: '0 16 * * *'  # 19:00 EEST (vara)
  # Buton de pornire manuala
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Run agent_stiri.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/agent_stiri.py

      - name: Commit & push stiri.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stiri.json
          git diff --cached --quiet && echo "Nimic de commitat" && exit 0
          git commit -m "Update stiri $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
