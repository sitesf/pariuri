name: Automatizare meciuri

on:
  schedule:
    # 05:00 ora Romaniei. GitHub Actions cron ruleaza in UTC.
    # Iarna (EET, UTC+2): 05:00 RO = 03:00 UTC
    # Vara (EEST, UTC+3): 05:00 RO = 02:00 UTC
    # Cele doua intrari acopera ambele perioade DST.
    # In zilele de tranzitie poate rula de doua ori - cache-ul absoarbe a doua rulare.
    - cron: '0 3 * * *'
    - cron: '0 2 * * *'
  # Buton de pornire manuala din interfata GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run analiza_meciuri.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python analiza_meciuri.py

      - name: Commit & push meciuri.json + cache.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meciuri.json cache.json
          # Daca nu sunt modificari, exit clean fara eroare
          git diff --cached --quiet && echo "Nimic de commitat" && exit 0
          git commit -m "Update meciuri $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
