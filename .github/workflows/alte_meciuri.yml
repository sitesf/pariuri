name: Automatizare alte meciuri

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run agent alte meciuri
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/alte_meciuri.py

      - name: Commit & Push JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add alte_meciuri.json
          git commit -m "update alte meciuri" || echo "no changes"
          git push
